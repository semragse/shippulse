apiVersion: 1

datasources:
  - name: ShipPulse Postgres
    uid: shippulse-pg
    type: postgres
    url: postgres:5432
    user: shippulse
    secureJsonData:
      password: shippulse
    jsonData:
      database: shippulse
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    version: 12
    editable: false
